name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Prepare release asset
        shell: pwsh
        run: Copy-Item `
          "target/x86_64-pc-windows-msvc/release/deadlock-api-ingest.exe" `
          "deadlock-api-ingest-windows-x86_64.exe"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: deadlock-api-ingest-windows-x86_64.exe
